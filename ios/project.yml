# Генерация проекта: `xcodegen generate` (brew install xcodegen).
# Перед генерацией поправьте BUNDLE_ID_PREFIX и DEVELOPMENT_TEAM.
name: FreeRDPTunIOS
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_ID_PREFIX: com.example       # <-- свой префикс, например ru.beebzzz
    DEVELOPMENT_TEAM: ""                # <-- Team ID (Xcode > Settings > Accounts)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1"          # только iPhone
targets:
  FreeRDPTun:
    type: application
    platform: iOS
    sources:
      - App
      - Shared/TunnelConfig.swift
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FreeRDPTun
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).freerdptun
        # Расширение: <bundle id приложения>.tunnel (используется в коде)
    dependencies:
      - target: PacketTunnel
        embed: true
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - Shared/TunnelConfig.swift
      - path: Shared/FRTCore.h
        buildPhase: none
    entitlements:
      path: Tunnel/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: FreeRDPTun Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    configFiles:
      Debug: Libs/frt.xcconfig
      Release: Libs/frt.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).freerdptun.tunnel
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/Tunnel-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Shared
          - $(SRCROOT)/../native
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Libs/lib
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: $(inherited) $(FRT_LIBS) -lresolv -lz -framework Security -framework CoreFoundation -framework SystemConfiguration
